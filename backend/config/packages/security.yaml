security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    # Hiérarchie : un Admin a tous les droits d'une Autorité, qui a tous ceux d'un Citoyen
    role_hierarchy:
        ROLE_AUTORITE: ROLE_USER
        ROLE_ADMIN: [ROLE_AUTORITE, ROLE_USER]

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        login:
            pattern: ^/api/login
            stateless: true
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/me, roles: IS_AUTHENTICATED_FULLY }
        # Les restrictions "signaler", "valider", "admin" seront ajoutées à l'étape 3b
        #  (après avoir branché l'envoi du token sur le front, pour ne rien casser)
