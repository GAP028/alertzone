# docker-compose — lance toute la stack back-end d'AlerteZone
# Usage : docker compose up --build
services:

  db:
    image: mysql:8.0
    container_name: alertezone_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: alertezone
      MYSQL_USER: alerte
      MYSQL_PASSWORD: alerte
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    container_name: alertezone_api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      APP_SECRET: alertezone_secret_dev
      DATABASE_URL: "mysql://alerte:alerte@db:3306/alertezone?serverVersion=8.0"
    volumes:
      - ./backend:/app

volumes:
  db_data:
